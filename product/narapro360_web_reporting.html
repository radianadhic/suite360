<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NARA Web Marketing Builder (ID/EN)</title>
<style>
:root{--navy:#0b1f3a;--blue:#2563eb;--gold:#f59e0b;--gold2:#fbbf24;--bg:#0f172a;--card:#1e293b;--card2:#172033;--line:#334155;--text:#e2e8f0;--muted:#94a3b8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:linear-gradient(135deg,var(--navy),var(--blue));padding:12px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0;flex-wrap:wrap}
header .lg{font-size:19px;font-weight:800}header .lg span{color:var(--gold2)}
header .sub{font-size:12px;color:#cbd5e1}
header .sp{flex:1}
.btn{padding:9px 15px;border:none;border-radius:9px;font-weight:700;cursor:pointer;font-size:13px}
.btn-gold{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#3b2700}
.btn-blue{background:linear-gradient(90deg,var(--blue),var(--navy));color:#fff}
.btn-lang{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)}
.btn:hover{opacity:.9}
.wrap{flex:1;display:grid;grid-template-columns:300px 1fr;overflow:hidden}
.side{background:var(--card2);border-right:1px solid var(--line);padding:16px;overflow-y:auto}
.side h4{font-size:11px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;margin:16px 0 8px}
.side h4:first-child{margin-top:0}
.item{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--card);border:1px solid var(--line);border-radius:9px;margin-bottom:7px;font-size:12.5px;cursor:pointer}
.item input{width:15px;height:15px;accent-color:var(--gold)}
.field{margin-bottom:11px}.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:700}
.field input,.field select,.field textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:#fff;font-size:13px}
.preview{overflow-y:auto;padding:22px;background:#0a1020}
/* landing */
.land{background:#fff;color:#0f172a;border-radius:14px;max-width:920px;margin:0 auto;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.land .hero{background:linear-gradient(135deg,#0b1f3a 0%,#1d3f8c 55%,#2563eb 100%);color:#fff;padding:54px 40px;text-align:center}
.land .hero h1{font-size:34px;line-height:1.2;margin-bottom:12px}
.land .hero p{font-size:16px;color:#dbe6f7;max-width:660px;margin:0 auto 22px}
.land .cta{display:inline-block;background:linear-gradient(90deg,var(--gold),var(--gold2));color:#3b2700;font-weight:800;padding:14px 32px;border-radius:11px;text-decoration:none;font-size:15px}
.land .kpi{display:flex;justify-content:center;gap:28px;margin-top:30px;flex-wrap:wrap}
.land .kpi div b{font-size:26px;display:block;color:var(--gold2)}.land .kpi div span{font-size:12px;color:#cbd5e1}
.land .sec{padding:44px 40px}.land .sec.alt{background:#f8fafc}
.land .sec h2{font-size:24px;color:var(--navy);margin-bottom:6px;text-align:center}
.land .sec .ss{text-align:center;color:#64748b;font-size:14px;margin-bottom:28px}
.land .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.land .f{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:20px;transition:.2s}
.land .f:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(15,23,42,.1);border-color:var(--gold)}
.land .f .ic{font-size:28px;display:block;margin-bottom:10px}
.land .f h3{font-size:15px;color:var(--navy);margin-bottom:6px}.land .f p{font-size:12.5px;color:#64748b;line-height:1.6}
.land .role{border-left:4px solid var(--gold);background:#fffdf5;border-radius:0 12px 12px 0;padding:18px 22px;margin-bottom:18px}
.land .role h3{color:var(--navy);font-size:17px;margin-bottom:6px}
.land .role ul{margin-left:18px;color:#475569;font-size:13.5px;line-height:1.8}
.land .band{background:linear-gradient(135deg,rgba(37,99,235,.06),rgba(245,158,11,.08));border:1px solid #e2e8f0;border-radius:16px;padding:26px;text-align:center}
.land .band h2{color:var(--navy);margin-bottom:14px}
.land .trust{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin-top:20px;font-size:12.5px;color:#475569}
.land footer{background:var(--navy);color:#94a3b8;padding:26px 40px;font-size:12px;line-height:1.7;text-align:center}.land footer b{color:#fff}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;margin-left:6px}
.tag.agen{background:rgba(37,99,235,.16);color:#1d4ed8}.tag.admin{background:rgba(245,158,11,.2);color:#b45309}
/* perbandingan vs kompetitor */
.vs table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
.vs th,.vs td{padding:9px 10px;border-bottom:1px solid #e2e8f0;text-align:left}
.vs thead th{background:#0b1f3a;color:#fff;font-size:11.5px}
.vs tbody th{color:var(--navy);font-weight:700}
.vs .yes{color:#15803d;font-weight:800;text-align:center}
.vs .no{color:#b91c1c;font-weight:800;text-align:center}
.vs .partial{color:#b45309;font-weight:700;text-align:center}
.vs td.name{text-align:center;font-size:11px;color:#64748b}
</style>
</head>

function openDemo(which){
  var url = which==='customer' ? 'customer-mobile.html' : 'app.html';
  window.open(url,'_blank');
}
var LANG='id';
function T(k){ return I18N[LANG][k]; }
var MODULES=null;

function toggleLang(){
  LANG = LANG==='id'?'en':'id';
  document.documentElement.lang=LANG;
  // isi ulang field teks default sesuai bahasa bila belum diubah pengguna (pakai data-k)
  ['tagline','hero','cta'].forEach(function(k){
    var el=document.getElementById(k);
    if(el) el.value=T('defaults')[k];
  });
  applyI18n(); renderChecks(); render();
}
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var k=el.getAttribute('data-i18n'); var v=T(k); if(v) el.textContent=v;
  });
  document.getElementById('langBtn').textContent = LANG==='id'?'🌐 EN':'🌐 ID';
  document.getElementById('selAllBtn').textContent=T('selAll');
  document.getElementById('dlBtn').textContent=T('dl');
}

/* bangun struktur MODULES dari i18n (on default true) */
function buildModules(){
  var m={}; var src=T('modules');
  ['customer','agent','admin','trust'].forEach(function(g){
    m[g]=src[g].map(function(row){ return {on:true,ic:row[0],t:row[1],d:row[2]}; });
  });
  return m;
}
function renderChecks(){
  MODULES=buildModules();
  // pertahankan status on bila sebelumnya ada (simpan global)
  ['customer','agent','admin','trust'].forEach(function(g){
    var box=document.getElementById('chks-'+g);
    box.innerHTML=MODULES[g].map(function(f,i){
      return '<label class="item"><input type="checkbox" '+(f.on?'checked':'')+' onchange="toggle(\''+g+'\','+i+',this.checked)"> <span>'+f.ic+' '+f.t+'</span></label>';
    }).join('');
  });
}
function toggle(g,i,v){ MODULES[g][i].on=v; render(); }
function toggleAll(){
  var all=true; MODULES && ['customer','agent','admin','trust'].forEach(function(g){MODULES[g].forEach(function(f){if(!f.on)all=false;});});
  ['customer','agent','admin','trust'].forEach(function(g){MODULES[g].forEach(function(f){f.on=!all;});});
  renderChecks(); render();
}

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(){
  MODULES = MODULES || buildModules();
  var brand=document.getElementById('brand').value;
  var tagline=document.getElementById('tagline').value;
  var hero=document.getElementById('hero').value;
  var cta=document.getElementById('cta').value;
  var total=MODULES.customer.filter(x=>x.on).length+MODULES.agent.filter(x=>x.on).length+MODULES.admin.filter(x=>x.on).length;

  var h='<div class="hero"><div style="font-size:15px;font-weight:800;letter-spacing:2px;margin-bottom:14px">🛡️ '+esc(brand)+'</div>';
  h+='<h1>'+esc(hero).replace(/\n/g,'<br>')+'</h1>';
  h+='<p><i>'+esc(tagline)+'</i> — '+T('heroSub')+'</p>';
  h+='<a class="cta" href="#">'+esc(cta)+' →</a>';
  h+='<div class="kpi"><div><b>4</b><span>'+T('kpiEco')+'</span></div><div><b>'+total+'+</b><span>'+T('kpiFeat')+'</span></div><div><b>12</b><span>'+T('kpiGw')+'</span></div><div><b>7</b><span>'+T('kpiRole')+'</span></div></div></div>';

  h+=section(T('custTitle'),T('custSub'),MODULES.customer.filter(f=>f.on),true);

  var role='<div class="sec"><h2>'+T('agentTitle')+'</h2><p class="ss">'+T('agentSub')+'</p>';
  role+='<div class="role"><h3>🧑‍💼 '+T('roleAgent')+' <span class="tag agen">'+T('ag')+'</span></h3><ul>'+
    MODULES.agent.filter(f=>f.on).map(f=>'<li><b>'+f.t+'</b> — '+f.d+'</li>').join('')+'</ul></div>';
  role+='<div class="role"><h3>🛠️ '+T('roleAdmin')+' <span class="tag admin">'+T('adm')+'</span></h3><ul>'+
    MODULES.admin.filter(f=>f.on).map(f=>'<li><b>'+f.t+'</b> — '+f.d+'</li>').join('')+'</ul></div></div>';
  h+=role;

  h+=section(T('trustTitle'),T('trustSub'),MODULES.trust.filter(f=>f.on),true);

  // ===== KELEBIHAN vs KOMPETITOR =====
  h+='<div class="sec vs"><h2>'+T('advTitle')+'</h2><p class="ss">'+T('advSub')+'</p>';
  h+='<div style="overflow-x:auto"><table><thead><tr><th>'+T('colCapability')+'</th>'
     +'<th class="name">'+T('colRobo')+'</th><th class="name">'+T('colInsur')+'</th>'
     +'<th class="name">'+T('colMulti')+'</th><th class="name">'+T('colLaku')+'</th>'
     +'<th class="name">'+T('colCrm')+'</th><th class="name" style="background:#f59e0b;color:#3b2700">'+T('colNara')+'</th></tr></thead><tbody>';
  T('advRows').forEach(function(r){
    h+='<tr><th>'+r[0]+'</th>';
    for(var c=1;c<r.length;c++){
      var v=r[c], cls='no', sym='✕';
      if(v==='yes'){cls='yes';sym='✓';} else if(v==='no'){cls='no';sym='✕';} else {cls='partial';sym='~';}
      h+='<td class="'+cls+(c===r.length-1?' yes':'')+'" style="'+(c===r.length-1?'background:#fffbeb;font-weight:800':'')+'">'+sym+'</td>';
    }
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  h+='<p class="ss" style="margin-top:14px;text-align:left"><b style="color:#15803d">✓</b> lengkap &nbsp; <b style="color:#b45309">~</b> sebagian &nbsp; <b style="color:#b91c1c">✕</b> tidak ada</p>';
  h+='<div style="text-align:center;margin-top:22px">';
  h+='<button onclick="window.open(\'customer-mobile.html\',\'_blank\')" style="background:#2563eb;color:#fff;border:none;padding:12px 22px;border-radius:10px;font-weight:800;cursor:pointer;margin:4px;font-size:14px">📱 '+T('btnCust')+'</button> ';
  h+='<button onclick="window.open(\'app.html\',\'_blank\')" style="background:#0b1f3a;color:#fff;border:none;padding:12px 22px;border-radius:10px;font-weight:800;cursor:pointer;margin:4px;font-size:14px">🛠️ '+T('btnAdmin')+'</button>';
  h+='</div></div>';

  h+='<div class="sec"><div class="band"><h2>'+T('closeTitle')+'</h2><p style="color:#475569;margin-bottom:18px">'+T('closeSub')+'</p>'+
     '<a class="cta" href="#">'+esc(cta)+' →</a>'+
     '<div class="trust"><span>✓ '+T('tAes')+'</span><span>✓ '+T('tOtp')+'</span><span>✓ '+T('tAudit')+'</span><span>✓ '+T('tLjk')+'</span></div></div></div>';

  h+='<footer><b>'+esc(brand)+'</b> '+T('footer1')+'<br>'+T('footer2')+'<br>'+T('footer3')+'</footer>';
  document.getElementById('land').innerHTML=h;
}
function section(title,sub,cards,alt){
  if(!cards.length) return '';
  var h='<div class="sec'+(alt?' alt':'')+'"><h2>'+title+'</h2><p class="ss">'+sub+'</p><div class="grid">';
  h+=cards.map(f=>'<div class="f"><span class="ic">'+f.ic+'</span><h3>'+esc(f.t)+'</h3><p>'+esc(f.d)+'</p></div>').join('');
  return h+'</div></div>';
}
function downloadMarketing(){
  var inner=document.getElementById('land').innerHTML;
  var html='<!DOCTYPE html><html lang="'+LANG+'"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+
    '<title>'+esc(document.getElementById('brand').value)+' — Marketing</title><style>'+
    document.querySelector('style').textContent+'body{background:#0a1020!important;padding:24px!important;height:auto!important;overflow:auto!important}.land{margin:auto!important}</style></head>'+
    '<body style="background:#0a1020;padding:24px"><div class="land">'+inner+'</div></body></html>';
  var blob=new Blob([html],{type:'text/html'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download = LANG==='id'?'web-marketing-id.html':'web-marketing-en.html';a.click();
  toast(T('done'));
}
function toast(m){var t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;bottom:24px;right:24px;background:#0b1f3a;border:1px solid #f59e0b;color:#fff;padding:12px 20px;border-radius:10px;font-weight:700;z-index:99';document.body.appendChild(t);setTimeout(()=>t.remove(),2500);}

['brand','tagline','hero','cta'].forEach(function(id){document.getElementById(id).addEventListener('input',render);});
applyI18n();
// isi default konten sesuai bahasa awal
['tagline','hero','cta'].forEach(function(k){document.getElementById(k).value=T('defaults')[k];});
renderChecks(); render();
</script>
</body>
</html>
